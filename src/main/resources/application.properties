spring.application.name=Food Mobo Chain
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# Spring Boot 4 MongoDB connection. Set the full Atlas URI as a Render environment variable.
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Account mail: AgentMail API over HTTPS, because Render Free blocks SMTP.
# These values must be provided through Render's secret environment settings.
app.public-base-url=${APP_PUBLIC_BASE_URL:https://food-mobo-chain-staging.onrender.com}
app.mail.agentmail-api-key=${AGENTMAIL_API_KEY:}
app.mail.inbox-id=${AGENTMAIL_INBOX_ID:}
app.mail.api-url=${MAIL_API_URL:https://api.agentmail.to}
app.mail.allow-loopback-http=${MAIL_ALLOW_LOOPBACK_HTTP:false}
# Diagnostics disabled by default; enable briefly only to self-test Render mail credentials.
app.mail.self-test-on-start=${APP_MAIL_SELF_TEST_ON_START:false}
app.seed.enabled=false
# Opt-in sanitized staging seed. Disabled on production and existing databases by default.
app.seed.catalog-enabled=${APP_SEED_DEMO_CATALOG:false}
# Off by default: one-time allowlisted migration for pre-existing staging demo users.
app.demo.verify-existing=${APP_DEMO_VERIFY_EXISTING:false}
# One-click, restricted, read-only demo sessions (staging only; default OFF).
app.demo.access-enabled=${APP_DEMO_ACCESS_ENABLED:false}
app.demo.allow-ci-loopback=${APP_DEMO_ALLOW_CI_LOOPBACK:false}
# Admin-managed invitation emails: typed in the app and confirmed with the real Admin password.
# The feature is only enabled on the fixed staging hostname and database.
app.instructor.access-enabled=${APP_INSTRUCTOR_ACCESS_ENABLED:false}

# JWT cookie security (the startup refuses an empty or short JWT secret).
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.auth.secure-cookies=${APP_SECURE_COOKIES:true}
server.forward-headers-strategy=framework

# Image hosting: no uploaded files should be stored on Render's ephemeral disk.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Bound MongoDB time spent during failed Atlas connection attempts.
# Specify the replicaSet in the Atlas connection URI if provided by Atlas.

# SSLCOMMERZ sandbox only (never use real merchant credentials here).
app.sslcommerz.mode=${SSLCOMMERZ_MODE:demo}
app.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
app.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
