spring.application.name=Food Mobo Chain
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# Spring Boot 4 MongoDB connection. Set the full Atlas URI as a Render environment variable.
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Password-reset demo tokens must not be printed outside an explicitly enabled dev profile.
app.password-reset.log-demo-link=false
app.seed.enabled=false
# Opt-in sanitized staging seed. Disabled on production and existing databases by default.
app.seed.catalog-enabled=${APP_SEED_DEMO_CATALOG:false}

# JWT cookie security (the startup refuses an empty or short JWT secret).
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.auth.secure-cookies=${APP_SECURE_COOKIES:true}
server.forward-headers-strategy=framework

# Image hosting: no uploaded files should be stored on Render's ephemeral disk.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Bound MongoDB time spent during failed Atlas connection attempts.
# Specify the replicaSet in the Atlas connection URI if provided by Atlas.
