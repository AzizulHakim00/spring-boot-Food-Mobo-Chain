<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Orders')}"></head><body class="has-mobile-nav"><div th:replace="~{fragments/site :: header('orders')}"></div><div th:replace="~{fragments/site :: flash}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Order history</span><h1 class="page-title">Every order in one place.</h1><p class="muted">Track active orders and revisit previous purchases.</p></div></section><section class="section compact"><div class="container"><div class="empty-state" th:if="${orders.isEmpty()}"><img th:src="@{/images/ui/empty-orders.svg}" alt=""/><h3>No orders yet</h3><p>Your first order will appear here as soon as you check out.</p><a class="button" th:href="@{/foods}">Find food</a></div><div class="stack" th:unless="${orders.isEmpty()}"><a class="form-card" th:each="order:${orders}" th:href="@{/orders/{number}(number=${order.orderNumber})}"><div class="cluster"><div class="grow"><span class="eyebrow" th:text="${order.orderNumber}"></span><h3 style="margin:4px 0" th:text="${order.foodCart.name}"></h3><small class="muted" th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, hh:mm a')}"></small></div><span class="badge" th:classappend="${order.status.name() == 'DELIVERED' ? 'success' : (order.status.name() == 'CANCELLED' ? 'danger' : 'info')}" th:text="${#strings.replace(order.status.name(),'_',' ')}"></span><strong>৳<span th:text="${#numbers.formatDecimal(order.total,1,0)}"></span></strong><img class="inline-icon" th:src="@{/images/icons/arrow-right.svg}" alt=""/></div></a></div></div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('orders')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
