<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Favorites')}"></head><body class="has-mobile-nav"><div th:replace="~{fragments/site :: header('')}"></div><div th:replace="~{fragments/site :: flash}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Saved for later</span><h1 class="page-title">Your favourites.</h1><p class="muted">Keep food and food carts you want to find quickly.</p></div></section><section class="section compact"><div class="container"><div class="empty-state" th:if="${favoriteFoods.isEmpty() and favoriteCarts.isEmpty()}"><img th:src="@{/images/ui/empty-favorites.svg}" alt=""/><h3>No favourites yet</h3><p>Save foods and carts while browsing and they will appear here.</p><a class="button" th:href="@{/foods}">Browse food</a></div><div th:unless="${favoriteFoods.isEmpty()}"><div class="section-head"><h2>Favorite foods</h2></div><div class="food-grid"><article class="food-card" th:each="fav:${favoriteFoods}"><a th:href="@{/foods/{id}(id=${fav.foodItem.id})}"><div class="food-image"><img th:src="${fav.foodItem.image}" th:alt="${fav.foodItem.name}"/></div></a><div class="food-body"><h3 th:text="${fav.foodItem.name}"></h3><p th:text="${fav.foodItem.foodCart.name}"></p><div class="food-foot"><strong>৳<span th:text="${#numbers.formatDecimal(fav.foodItem.price,1,0)}"></span></strong><form th:action="@{/favorites/foods/{id}(id=${fav.foodItem.id})}" method="post"><button class="button small secondary">Remove</button></form></div></div></article></div></div><div th:unless="${favoriteCarts.isEmpty()}" style="margin-top:44px"><div class="section-head"><h2>Favorite food carts</h2></div><div class="vendor-grid"><article class="vendor-card" th:each="fav:${favoriteCarts}"><a th:href="@{/food-carts/{slug}(slug=${fav.foodCart.slug})}"><img th:src="${fav.foodCart.coverImage}" th:alt="${fav.foodCart.name}"/><div class="vendor-overlay"><span th:text="${fav.foodCart.open ? 'Open' : 'Closed'}"></span><h3 th:text="${fav.foodCart.name}"></h3><p th:text="${fav.foodCart.cuisine}"></p></div></a><form style="position:absolute;right:14px;top:14px;z-index:3" th:action="@{/favorites/carts/{id}(id=${fav.foodCart.id})}" method="post"><button class="icon-btn" title="Remove favorite" aria-label="Remove favorite"><img class="ui-icon" th:src="@{/images/icons/close.svg}" alt=""/></button></form></article></div></div></div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
