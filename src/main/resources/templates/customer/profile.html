<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Profile')}"></head>
<body class="has-mobile-nav">
<div th:replace="~{fragments/site :: header('')}"></div>
<div th:replace="~{fragments/site :: flash}"></div>
<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">My account</span>
      <h1 class="page-title">Profile settings</h1>
      <p class="muted">Manage your personal details and account security in one place.</p>
    </div>
  </section>
  <section class="section compact">
    <div class="container profile-settings-layout">
      <form class="form-card profile-form" th:action="@{/profile}" th:object="${profile}" method="post">
        <h2>Personal information</h2>
        <div class="form-grid profile-grid">
          <div class="field full">
            <label class="required" for="profileFullName">Full name</label>
            <input id="profileFullName" th:field="*{fullName}" autocomplete="name" required/>
            <small class="field-error" th:errors="*{fullName}"></small>
          </div>
          <div class="field">
            <label for="profileEmail">Email</label>
            <input id="profileEmail" th:value="${currentUser.email}" type="email" autocomplete="email" disabled/>
          </div>
          <div class="field">
            <label class="required" for="profilePhone">Phone</label>
            <input id="profilePhone" th:field="*{phone}" autocomplete="tel" required/>
            <small class="field-error" th:errors="*{phone}"></small>
          </div>
          <div class="field full profile-address-field">
            <label for="profileAddress">Default delivery address</label>
            <textarea id="profileAddress" th:field="*{address}" rows="4" autocomplete="street-address"></textarea>
            <small class="field-error" th:errors="*{address}"></small>
          </div>
        </div>
        <div class="profile-save-row">
          <button class="button" type="submit">Save changes</button>
          <span class="badge" th:text="${currentUser.role}">Account</span>
        </div>
      </form>
      <section class="form-card profile-security-card" aria-labelledby="profileSecurityTitle">
        <div>
          <span class="eyebrow">Account protection</span>
          <h2 id="profileSecurityTitle">Password &amp; security</h2>
          <p class="muted">Update your password securely. You'll be signed out of your previous sessions.</p>
        </div>
        <a class="button secondary" th:href="@{/account/password}">Change password</a>
      </section>
    </div>
  </section>
</main>
<div th:replace="~{fragments/site :: footer}"></div>
<div th:replace="~{fragments/site :: mobileNav('profile')}"></div>
<script th:replace="~{fragments/site :: scripts}"></script>
</body>
</html>
