<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Your cart')}"></head><body class="has-mobile-nav"><div th:replace="~{fragments/site :: header('')}"></div><div th:replace="~{fragments/site :: flash}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Shopping bag</span><h1 class="page-title">Your cart.</h1><p class="muted" th:if="${cart.foodCart != null}">Ordering from <b th:text="${cart.foodCart.name}"></b>.</p></div></section><section class="section compact"><div class="container">
<div class="empty-state" th:if="${cart.items.isEmpty()}"><img th:src="@{/images/ui/empty-cart.svg}" alt=""/><h3>Your cart is empty</h3><p>Browse available food carts and add something you love.</p><a class="button" th:href="@{/foods}">Browse foods</a></div>
<div class="two-col-checkout" th:unless="${cart.items.isEmpty()}"><div class="form-card"><div class="cart-line" th:each="item:${cart.items}"><img th:src="${item.foodItem.image}" th:alt="${item.foodItem.name}"/><div><b th:text="${item.foodItem.name}"></b><small class="muted" style="display:block" th:text="${item.foodItem.foodCart.name}"></small><strong>৳<span th:text="${#numbers.formatDecimal(item.foodItem.price,1,0)}"></span></strong></div><form class="cart-controls cluster" th:action="@{/cart/items/{id}/update(id=${item.id})}" method="post"><input style="width:70px" type="number" name="quantity" min="1" max="20" th:value="${item.quantity}"/><select name="spiceLevel" th:disabled="${!item.foodItem.spicySupported}"><option th:each="level:${spiceLevels}" th:value="${level}" th:text="${#strings.replace(level.name(),'_',' ')}" th:selected="${level == item.spiceLevel}"></option></select><input th:if="${!item.foodItem.spicySupported}" type="hidden" name="spiceLevel" value="REGULAR"/><button class="button small secondary">Update</button></form><strong>৳<span th:text="${#numbers.formatDecimal(item.foodItem.price * item.quantity,1,0)}"></span></strong><form th:action="@{/cart/items/{id}/remove(id=${item.id})}" method="post" data-confirm="This item will be removed from your cart." data-confirm-title="Remove item?" data-confirm-action="Remove item" data-confirm-cancel="Keep item" data-confirm-variant="danger"><button class="icon-btn" aria-label="Remove item"><img class="ui-icon" th:src="@{/images/icons/close.svg}" alt=""/></button></form></div><form th:action="@{/cart/clear}" method="post" data-confirm="Every item in this cart will be removed." data-confirm-title="Clear cart?" data-confirm-action="Clear cart" data-confirm-cancel="Keep items" data-confirm-variant="danger" style="margin-top:18px"><button class="button ghost">Clear cart</button></form></div>
<aside class="summary-card"><span class="eyebrow light">Summary</span><h2>Ready to order?</h2><div class="summary-row"><span>Subtotal</span><b>৳<span th:text="${#numbers.formatDecimal(subtotal,1,0)}"></span></b></div><div class="summary-row"><span>Delivery</span><b>৳<span th:text="${#numbers.formatDecimal(cart.foodCart.deliveryFee,1,0)}"></span></b></div><div class="summary-row total"><span>Before discount</span><b>৳<span th:text="${#numbers.formatDecimal(subtotal.add(cart.foodCart.deliveryFee),1,0)}"></span></b></div><a class="button full" th:href="@{/checkout}">Continue to checkout</a><a class="button secondary full" style="margin-top:10px" th:href="@{/foods(cart=${cart.foodCart.id})}">Add more items</a></aside></div>
</div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('cart')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
