<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Browse foods')}"></head><body class="has-mobile-nav">
<div th:replace="~{fragments/site :: header('foods')}"></div><div th:replace="~{fragments/site :: flash}"></div>
<main><section class="page-hero"><div class="container page-hero-row"><div><span class="eyebrow">Discover</span><h1>Find your next craving.</h1><p>Search, filter and compare available food from approved carts.</p></div></div></section>
<section class="section compact"><div class="container">
<form class="filter-bar" th:action="@{/foods}" method="get"><input name="q" th:value="${q}" placeholder="Search food or cart…"/><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c.slug}" th:text="${c.name}" th:selected="${c.slug == selectedCategory}"></option></select><select name="cart"><option value="">All food carts</option><option th:each="c:${foodCarts}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == selectedCart}"></option></select><select name="sort"><option value="popular" th:selected="${sort=='popular'}">Featured</option><option value="priceLow" th:selected="${sort=='priceLow'}">Price: low to high</option><option value="priceHigh" th:selected="${sort=='priceHigh'}">Price: high to low</option><option value="newest" th:selected="${sort=='newest'}">Newest</option></select><input type="number" name="max" min="0" step="10" th:value="${max}" placeholder="Max price"/><button class="button">Apply</button></form>
<div class="food-grid" th:if="${!foods.content.isEmpty()}"><article class="food-card reveal" th:each="food:${foods.content}"><a class="food-card-link" th:href="@{/foods/{id}(id=${food.id})}"><div class="food-image"><img th:src="${food.image}" th:alt="${food.name}"/><span th:if="${food.spicySupported}">Spice choice</span></div></a><div class="food-body"><div class="food-title"><div><h3 th:text="${food.name}"></h3><small th:text="${food.foodCart.name}"></small></div><span class="badge" th:text="${food.category.name}"></span></div><p th:text="${food.description}"></p><div class="food-foot"><strong>৳<span th:text="${#numbers.formatDecimal(food.price,1,0)}"></span></strong><a class="add-button" th:href="@{/foods/{id}(id=${food.id})}"><img class="inline-icon" th:src="@{/images/icons/arrow-right.svg}" alt="View"/></a></div></div></article></div>
<div class="empty-state" th:if="${foods.content.isEmpty()}"><img th:src="@{/images/ui/no-results.svg}" alt=""/><h3>No matching food found</h3><p>Try a different keyword or remove a filter.</p><a class="button" th:href="@{/foods}">Clear filters</a></div>
<div class="pagination" th:if="${foods.totalPages > 1}"><a th:if="${foods.hasPrevious()}" th:href="@{/foods(q=${q},category=${selectedCategory},cart=${selectedCart},sort=${sort},page=${foods.number-1})}"><img class="inline-icon" th:src="@{/images/icons/arrow-left.svg}" alt="Previous"/></a><span class="active" th:text="${foods.number + 1}"></span><span class="page-count" th:text="'of ' + ${foods.totalPages}"></span><a th:if="${foods.hasNext()}" th:href="@{/foods(q=${q},category=${selectedCategory},cart=${selectedCart},sort=${sort},page=${foods.number+1})}"><img class="inline-icon" th:src="@{/images/icons/arrow-right.svg}" alt="View"/></a></div>
</div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('foods')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
