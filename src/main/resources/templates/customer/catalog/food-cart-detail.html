<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Food cart details')}"></head><body class="has-mobile-nav"><div th:replace="~{fragments/site :: header('carts')}"></div><div th:replace="~{fragments/site :: flash}"></div><main>
<section class="section compact"><div class="container"><div class="vendor-hero"><img th:src="${foodCart.coverImage}" th:alt="${foodCart.name}"/><div><span class="eyebrow" th:text="${foodCart.cuisine}"></span><h1 th:text="${foodCart.name}"></h1><p th:text="${foodCart.description}"></p><div class="cluster"><span class="badge" th:classappend="${foodCart.open ? 'success' : 'danger'}" th:text="${foodCart.open ? 'Open now' : 'Closed'}"></span><span class="badge">★ <span th:text="${rating}"></span></span><span class="badge" th:text="${foodCart.location}"></span><span class="badge"><span th:text="${foodCart.estimatedDeliveryMinutes}"></span> min</span></div><form style="margin-top:16px" th:if="${currentUser != null and currentUser.role.name() == 'BUYER'}" th:action="@{/favorites/carts/{id}(id=${foodCart.id})}" method="post"><button class="button secondary"><img class="button-icon" th:src="@{/images/icons/heart.svg}" alt=""/><span th:text="${favorite ? 'Remove from favorites' : 'Save food cart'}"></span></button></form></div></div></div></section>
<section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Full menu</span><h2>Choose something good</h2></div><a class="text-link" th:href="@{/foods(cart=${foodCart.id})}">Filter this menu <img class="inline-icon" th:src="@{/images/icons/arrow-right.svg}" alt=""/></a></div><div class="food-grid"><article class="food-card" th:each="food:${menu}"><a th:href="@{/foods/{id}(id=${food.id})}"><div class="food-image"><img th:src="${food.image}" th:alt="${food.name}"/><span th:if="${!food.available}">Unavailable</span></div></a><div class="food-body"><div class="food-title"><div><h3 th:text="${food.name}"></h3><small th:text="${food.category.name}"></small></div></div><p th:text="${food.description}"></p><div class="food-foot"><strong>৳<span th:text="${#numbers.formatDecimal(food.price,1,0)}"></span></strong><a class="add-button" th:href="@{/foods/{id}(id=${food.id})}"><img class="inline-icon" th:src="@{/images/icons/arrow-right.svg}" alt="View"/></a></div></div></article></div></div></section>
<section class="section soft"><div class="container"><div class="section-head"><div><span class="eyebrow">Cart reviews</span><h2>What customers say</h2></div></div><div class="review-list"><article class="review-card" th:each="review:${reviews}"><div class="cluster"><b th:text="${review.buyer.fullName}"></b><span class="stars" th:text="${#strings.repeat('★',review.rating)}"></span></div><p th:text="${review.comment}"></p></article><div class="empty-state" th:if="${reviews.isEmpty()}"><h3>No cart reviews yet</h3><p>Delivered-order customers can review this food cart.</p></div></div></div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('carts')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
