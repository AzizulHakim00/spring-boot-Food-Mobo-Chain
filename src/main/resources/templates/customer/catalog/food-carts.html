<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Food carts')}"></head><body class="has-mobile-nav"><div th:replace="~{fragments/site :: header('carts')}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Verified vendors</span><h1 class="page-title">Meet the carts behind the food.</h1><p class="muted">Approved local sellers, clear availability and their full menus in one place.</p></div></section><section class="section compact"><div class="container"><div class="vendor-grid"><a class="vendor-card reveal" th:each="cart:${foodCarts}" th:href="@{/food-carts/{slug}(slug=${cart.slug})}"><img th:src="${cart.coverImage}" th:alt="${cart.name}"/><div class="vendor-overlay"><span th:text="${cart.open ? 'Open now' : 'Closed'}"></span><h3 th:text="${cart.name}"></h3><p th:text="${cart.cuisine}"></p><div><small th:text="${cart.location}"></small><small><span th:text="${cart.estimatedDeliveryMinutes}"></span> min</small><small>৳<span th:text="${#numbers.formatDecimal(cart.deliveryFee,1,0)}"></span></small></div></div></a></div></div></section></main><div th:replace="~{fragments/site :: footer}"></div><div th:replace="~{fragments/site :: mobileNav('carts')}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
