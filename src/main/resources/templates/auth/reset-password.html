<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Reset password')}"></head><body><main class="auth-shell"><section class="auth-art"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><div><h1>Choose a fresh, strong password.</h1></div></section><section class="auth-panel"><div class="auth-card"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><div th:if="${invalidToken}" class="empty-state"><h3>Reset link is invalid or expired</h3><p>Request another password reset link.</p><a class="button" th:href="@{/forgot-password}">Request new link</a></div><div th:unless="${invalidToken}"><span class="eyebrow">Secure reset</span><h2>Set a new password</h2><form th:action="@{/reset-password}" th:object="${resetPassword}" method="post" class="stack"><input type="hidden" th:field="*{token}"/><div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="field"><label>New password</label><input type="password" th:field="*{password}"/><small class="field-error" th:errors="*{password}"></small></div><div class="field"><label>Confirm password</label><input type="password" th:field="*{confirmPassword}"/><small class="field-error" th:errors="*{confirmPassword}"></small><small class="field-error" th:errors="*{passwordMatching}"></small></div><button class="button full">Change password</button></form></div></div></section></main><script th:replace="~{fragments/site :: scripts}"></script></body></html>
