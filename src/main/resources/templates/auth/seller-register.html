<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Seller registration')}"></head><body><div th:replace="~{fragments/site :: header('')}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Partner onboarding</span><h1 class="page-title">Bring your food cart online.</h1><p>Register your seller account and basic cart information. An administrator reviews the cart before it can open publicly.</p></div></section><section class="section compact"><div class="container" style="max-width:900px"><form class="form-card" th:action="@{/seller/register}" th:object="${sellerRegistration}" method="post" data-loading><div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><h2>Owner information</h2><div class="form-grid"><div class="field"><label class="required">Full name</label><input th:field="*{fullName}"/><small class="field-error" th:errors="*{fullName}"></small></div><div class="field"><label class="required">Phone</label><input th:field="*{phone}"/><small class="field-error" th:errors="*{phone}"></small></div><div class="field full"><label class="required">Email</label><input type="email" th:field="*{email}"/><small class="field-error" th:errors="*{email}"></small></div><div class="field"><label class="required">Password</label><input type="password" th:field="*{password}"/><small class="field-error" th:errors="*{password}"></small></div><div class="field"><label class="required">Confirm password</label><input type="password" th:field="*{confirmPassword}"/><small class="field-error" th:errors="*{confirmPassword}"></small><small class="field-error" th:errors="*{passwordMatching}"></small></div></div><h2 style="margin-top:30px">Food cart information</h2><div class="form-grid"><div class="field"><label class="required">Food cart name</label><input th:field="*{cartName}"/><small class="field-error" th:errors="*{cartName}"></small></div><div class="field"><label class="required">Cuisine</label><input th:field="*{cuisine}" placeholder="Bangladeshi, Street food…"/><small class="field-error" th:errors="*{cuisine}"></small></div><div class="field full"><label class="required">Location</label><input th:field="*{location}"/><small class="field-error" th:errors="*{location}"></small></div><div class="field full"><label class="required">Description</label><textarea th:field="*{description}" maxlength="1000"></textarea><small class="field-error" th:errors="*{description}"></small></div><div class="field"><label class="required">Delivery fee (৳)</label><input type="number" step="1" min="0" th:field="*{deliveryFee}"/><small class="field-error" th:errors="*{deliveryFee}"></small></div><div class="field"><label class="required">Estimated delivery (minutes)</label><input type="number" min="10" max="180" th:field="*{estimatedDeliveryMinutes}"/><small class="field-error" th:errors="*{estimatedDeliveryMinutes}"></small></div></div><div class="cluster" style="margin-top:24px"><button class="button" type="submit">Submit seller registration</button><a class="button secondary" th:href="@{/login}">Back to sign in</a></div></form></div></section></main><div th:replace="~{fragments/site :: footer}"></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
