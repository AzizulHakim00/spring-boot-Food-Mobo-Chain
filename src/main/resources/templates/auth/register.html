<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Create account')}"></head><body><main class="auth-shell"><section class="auth-art"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><div><h1>Save favourites. Order faster. Track every delivery.</h1><img class="auth-food" th:src="@{/images/foods/chicken-momo.webp}" alt="Chicken momo"/></div><p>A buyer account keeps your profile, orders, favourites and notifications together.</p></section><section class="auth-panel"><div class="auth-card"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><span class="eyebrow">Buyer account</span><h2>Create your account</h2><form th:action="@{/register}" th:object="${registration}" method="post" class="stack" data-loading><div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><div class="field full"><label class="required">Full name</label><input th:field="*{fullName}" autocomplete="name"/><small class="field-error" th:errors="*{fullName}"></small></div><div class="field"><label class="required">Email</label><input th:field="*{email}" type="email" autocomplete="email"/><small class="field-error" th:errors="*{email}"></small></div><div class="field"><label class="required">Phone</label><input th:field="*{phone}" placeholder="01XXXXXXXXX"/><small class="field-error" th:errors="*{phone}"></small></div><div class="field"><label class="required">Password</label><div class="password-wrap"><input id="regPassword" th:field="*{password}" type="password" autocomplete="new-password"/><button type="button" class="password-toggle" data-password-toggle="regPassword">Show</button></div><small class="hint">8+ characters with upper, lower and a number.</small><small class="field-error" th:errors="*{password}"></small></div><div class="field"><label class="required">Confirm password</label><input th:field="*{confirmPassword}" type="password" autocomplete="new-password"/><small class="field-error" th:errors="*{confirmPassword}"></small><small class="field-error" th:errors="*{passwordMatching}"></small></div></div><button class="button full" type="submit">Create buyer account</button></form><div class="auth-links"><a th:href="@{/login}">Already registered? Sign in</a><a th:href="@{/seller/register}">Register as seller</a></div></div></section></main><script th:replace="~{fragments/site :: scripts}"></script></body></html>
