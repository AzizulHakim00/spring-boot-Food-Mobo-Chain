<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Forgot password')}"></head><body><main class="auth-shell"><section class="auth-art"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><div><h1>Reset access without exposing account details.</h1></div><p>Reset links are time-limited and single-use.</p></section><section class="auth-panel"><div class="auth-card"><a class="brand" th:href="@{/}"><img th:src="@{/images/logo/food-mobo-chain-logo.svg}" alt=""/><span>Food Mobo Chain</span></a><span class="eyebrow">Account recovery</span><h2>Forgot your password?</h2><p class="muted">Enter your account email. For privacy, the response is the same whether the email exists or not.</p><div class="alert" th:if="${success}" th:text="${success}"></div><form th:action="@{/forgot-password}" th:object="${forgotPassword}" method="post" class="stack"><div class="field"><label>Email</label><input type="email" th:field="*{email}"/><small class="field-error" th:errors="*{email}"></small></div><button class="button full">Send reset link</button></form><div class="auth-links"><a th:href="@{/login}">Back to sign in</a></div></div></section></main><script th:replace="~{fragments/site :: scripts}"></script></body></html>
