<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Change password')}"></head>
<body>
<div th:replace="~{fragments/site :: header('')}"></div>
<main>
  <section class="page-hero"><div class="container">
    <span class="eyebrow">Account security</span>
    <h1 class="page-title">Change your password</h1>
    <p class="muted">Your old sessions will be signed out when the password changes.</p>
  </div></section>
  <section class="section compact"><div class="container" style="max-width:650px">
    <form class="form-card stack" th:action="@{/account/password}"
          th:object="${changePassword}" method="post">
      <div class="form-error" th:if="${#fields.hasGlobalErrors()}"
           th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
      <div class="field">
        <label class="required" for="currentPassword">Current password</label>
        <input id="currentPassword" th:field="*{currentPassword}" type="password"
               autocomplete="current-password" required/>
        <small class="field-error" th:errors="*{currentPassword}"></small>
      </div>
      <div class="field">
        <label class="required" for="newPassword">New password</label>
        <input id="newPassword" th:field="*{newPassword}" type="password"
               autocomplete="new-password" required/>
        <small class="field-error" th:errors="*{newPassword}"></small>
      </div>
      <div class="field">
        <label class="required" for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
               autocomplete="new-password" required/>
        <small class="field-error" th:errors="*{confirmPassword}"></small>
        <small class="field-error" th:errors="*{passwordMatching}"></small>
      </div>
      <button class="button full" type="submit">Update password</button>
    </form>
  </div></section>
</main>
<div th:replace="~{fragments/site :: footer}"></div>
<script th:replace="~{fragments/site :: scripts}"></script>
</body>
</html>
