<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Order details')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('orders')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Order details','Audit view')}"></div><section class="dashboard-grid-2"><div class="panel"><div class="panel-head"><div><h2>Order items</h2><p class="muted"><span th:text="${order.foodCart.name}"></span> • <span th:text="${order.buyer.fullName}"></span></p></div><span class="badge" th:text="${#strings.replace(order.status.name(),'_',' ')}"></span></div><div class="cart-line" th:each="item:${order.items}"><img th:src="${item.foodImage}" th:alt="${item.foodName}"/><div><b th:text="${item.foodName}"></b><small class="muted" style="display:block" th:text="${item.quantity + ' × ৳' + #numbers.formatDecimal(item.unitPrice,1,0)}"></small></div><span></span><strong>৳<span th:text="${#numbers.formatDecimal(item.subtotal,1,0)}"></span></strong><span></span></div></div><aside class="stack"><div class="summary-card"><span class="eyebrow light">Financial record</span><h2 th:text="${payment.status}"></h2><div class="summary-row"><span>Gateway</span><b th:text="${payment.gateway}"></b></div><div class="summary-row"><span>Transaction</span><b th:text="${payment.transactionId}"></b></div><div class="summary-row"><span>Subtotal</span><b>৳<span th:text="${#numbers.formatDecimal(order.subtotal,1,0)}"></span></b></div><div class="summary-row"><span>Discount</span><b>-৳<span th:text="${#numbers.formatDecimal(order.discountAmount,1,0)}"></span></b></div><div class="summary-row total"><span>Total</span><b>৳<span th:text="${#numbers.formatDecimal(order.total,1,0)}"></span></b></div></div><div class="panel"><h3>Delivery record</h3><p th:text="${delivery.address}"></p><div class="stat-row"><span>Status</span><span class="badge" th:text="${#strings.replace(delivery.status.name(),'_',' ')}"></span></div><div class="stat-row"><span>Phone</span><b th:text="${delivery.contactNumber}"></b></div></div><form th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}" th:action="@{/admin/orders/{n}/cancel(n=${order.orderNumber})}" method="post" data-confirm="This order will be cancelled. Paid orders will be flagged for refund review." data-confirm-title="Cancel order?" data-confirm-action="Cancel order" data-confirm-cancel="Keep order" data-confirm-variant="danger"><button class="button danger full">Cancel order</button></form></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
