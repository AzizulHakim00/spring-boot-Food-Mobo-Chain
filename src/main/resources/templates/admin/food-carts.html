<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Manage food carts')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('carts')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Food-cart management','Vendors')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="panel"><div class="panel-head"><div><h2>Seller food carts</h2><p class="muted">Approval controls whether a cart may open publicly.</p></div></div><div class="table-wrap"><table><thead><tr><th>Food cart</th><th>Owner</th><th>Location</th><th>Public state</th><th>Approval</th><th></th></tr></thead><tbody><tr th:each="cart:${foodCarts}"><td><div class="table-food"><img th:src="${cart.coverImage}" th:alt="${cart.name}"/><div><b th:text="${cart.name}"></b><small class="muted" style="display:block" th:text="${cart.cuisine}"></small></div></div></td><td><span th:text="${cart.owner.fullName}"></span><small class="muted" style="display:block" th:text="${cart.owner.email}"></small></td><td th:text="${cart.location}"></td><td><span class="badge" th:classappend="${cart.open ? 'success' : 'dark'}" th:text="${cart.open ? 'Open' : 'Closed'}"></span></td><td><span class="badge" th:classappend="${cart.approved ? 'success' : 'warn'}" th:text="${cart.approved ? 'Approved' : 'Pending'}"></span></td><td><form th:action="@{/admin/food-carts/{id}/approval(id=${cart.id})}" method="post" data-confirm="Change this food cart approval status?"><button class="button small" th:classappend="${cart.approved ? 'danger' : ''}" th:text="${cart.approved ? 'Suspend' : 'Approve'}"></button></form></td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
