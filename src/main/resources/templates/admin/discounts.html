<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Discounts')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('discounts')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Discounts & offers','Marketing')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="dashboard-grid-2"><div class="panel"><div class="panel-head"><div><h2>Campaigns</h2><p class="muted">Only active offers inside their date range can be applied at checkout.</p></div></div><div class="stack"><article class="form-card" th:each="d:${discounts}" style="padding:18px"><div class="cluster"><div class="grow"><code th:text="${d.code}"></code><h3 style="margin:6px 0" th:text="${d.name}"></h3><p class="muted" th:text="${d.description}"></p><small th:text="${#temporals.format(d.startsAt,'dd MMM yyyy') + ' — ' + #temporals.format(d.endsAt,'dd MMM yyyy')}"></small></div><span class="badge" th:classappend="${d.active ? 'success':'dark'}" th:text="${d.active ? 'Active':'Disabled'}"></span><form th:action="@{/admin/discounts/{id}/toggle(id=${d.id})}" method="post"><button class="button small secondary" th:text="${d.active ? 'Disable':'Enable'}"></button></form></div></article></div></div><aside class="panel"><span class="eyebrow">New campaign</span><h2>Create discount</h2><form class="stack" th:action="@{/admin/discounts}" th:object="${discountForm}" method="post"><div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="field"><label>Code</label><input th:field="*{code}" placeholder="WEEKEND20"/><small class="field-error" th:errors="*{code}"></small></div><div class="field"><label>Name</label><input th:field="*{name}"/><small class="field-error" th:errors="*{name}"></small></div><div class="field"><label>Description</label><textarea th:field="*{description}"></textarea><small class="field-error" th:errors="*{description}"></small></div><div class="form-grid"><div class="field"><label>Type</label><select th:field="*{type}"><option value="">Choose</option><option th:each="t:${discountTypes}" th:value="${t}" th:text="${#strings.replace(t.name(),'_',' ')}"></option></select></div><div class="field"><label>Value</label><input type="number" step="0.01" min="0.01" th:field="*{value}"/></div><div class="field"><label>Minimum order</label><input type="number" step="0.01" min="0" th:field="*{minimumOrder}"/></div><div class="field"><label>Maximum discount</label><input type="number" step="0.01" min="0" th:field="*{maximumDiscount}"/></div><div class="field"><label>Starts</label><input type="datetime-local" th:field="*{startsAt}"/></div><div class="field"><label>Ends</label><input type="datetime-local" th:field="*{endsAt}"/></div></div><label class="cluster"><input type="checkbox" th:field="*{active}"/> Active immediately within date range</label><button class="button">Create discount</button></form></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
