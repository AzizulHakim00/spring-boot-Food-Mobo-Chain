<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Manage users')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('users')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('User management','Accounts')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="panel"><div class="panel-head"><div><h2>Registered accounts</h2><p class="muted">Suspend or reactivate buyer and seller access. Admin accounts cannot be suspended here.</p></div></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th><th>Action</th></tr></thead><tbody><tr th:each="user:${users}"><td><b th:text="${user.fullName}"></b><small class="muted" style="display:block" th:text="${user.email}"></small></td><td th:text="${user.phone}"></td><td><span class="badge" th:text="${user.role}"></span></td><td><span class="badge" th:classappend="${user.enabled ? 'success' : 'danger'}" th:text="${user.enabled ? 'Active' : 'Suspended'}"></span></td><td th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></td><td><form th:if="${user.role.name() != 'ADMIN'}" th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" data-confirm="Change access for this account?"><button class="button small secondary" th:text="${user.enabled ? 'Suspend' : 'Activate'}"></button></form><span th:if="${user.role.name() == 'ADMIN'}">Protected</span></td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
