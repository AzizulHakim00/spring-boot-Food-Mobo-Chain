<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Review moderation')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('reviews')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Review moderation','Community')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="panel"><div class="panel-head"><div><h2>Customer reviews</h2><p class="muted"><b th:text="${pendingReviews}"></b> reviews are waiting for approval.</p></div></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Target</th><th>Rating</th><th>Comment</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="review:${reviews}"><td th:text="${review.buyer.fullName}"></td><td th:text="${review.foodItem != null ? review.foodItem.name : review.foodCart.name}"></td><td><span class="stars" th:text="${#strings.repeat('★',review.rating)}"></span></td><td th:text="${#strings.abbreviate(review.comment,100)}"></td><td><span class="badge" th:classappend="${review.hidden?'danger':(review.approved?'success':'warn')}" th:text="${review.hidden?'Hidden':(review.approved?'Approved':'Pending')}"></span></td><td><div class="table-actions"><form th:if="${!review.approved or review.hidden}" th:action="@{/admin/reviews/{id}/approve(id=${review.id})}" method="post"><button>Approve</button></form><form th:if="${!review.hidden}" th:action="@{/admin/reviews/{id}/hide(id=${review.id})}" method="post" data-confirm="Hide this review from public pages?"><button class="danger">Hide</button></form></div></td></tr><tr th:if="${reviews.isEmpty()}"><td colspan="6">No reviews submitted yet.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
