<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Admin orders')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('orders')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Order monitoring','Operations')}"></div><section class="panel"><div class="panel-head"><div><h2>Recent orders</h2><p class="muted">A platform-wide operational view. Sellers control their own fulfillment status.</p></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Buyer</th><th>Food cart</th><th>Total</th><th>Status</th><th>Placed</th><th></th></tr></thead><tbody><tr th:each="order:${orders}"><td><b th:text="${order.orderNumber}"></b></td><td th:text="${order.buyer.fullName}"></td><td th:text="${order.foodCart.name}"></td><td>৳<span th:text="${#numbers.formatDecimal(order.total,1,0)}"></span></td><td><span class="badge" th:classappend="${order.status.name()=='DELIVERED'?'success':(order.status.name()=='CANCELLED'?'danger':'info')}" th:text="${#strings.replace(order.status.name(),'_',' ')}"></span></td><td th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, hh:mm a')}"></td><td><a class="button small secondary" th:href="@{/admin/orders/{n}(n=${order.orderNumber})}">Inspect</a></td></tr><tr th:if="${orders.isEmpty()}"><td colspan="7">No orders recorded yet.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
