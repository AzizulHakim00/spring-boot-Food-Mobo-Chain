<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Deliveries')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('deliveries')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Delivery monitoring','Operations')}"></div><section class="panel"><div class="panel-head"><div><h2>Delivery records</h2><p class="muted">Delivery state follows seller order processing and remains auditable by admin.</p></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Food cart</th><th>Contact</th><th>Estimate</th><th>Status</th><th>Address</th></tr></thead><tbody><tr th:each="delivery:${deliveries}"><td><a class="text-link" th:href="@{/admin/orders/{n}(n=${delivery.order.orderNumber})}" th:text="${delivery.order.orderNumber}"></a></td><td th:text="${delivery.order.foodCart.name}"></td><td th:text="${delivery.contactNumber}"></td><td><span th:text="${delivery.estimatedMinutes}"></span> min</td><td><span class="badge" th:text="${#strings.replace(delivery.status.name(),'_',' ')}"></span></td><td th:text="${#strings.abbreviate(delivery.address,60)}"></td></tr><tr th:if="${deliveries.isEmpty()}"><td colspan="6">No delivery records yet.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
