<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Payments')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('payments')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Payment monitoring','Operations')}"></div><section class="panel"><div class="panel-head"><div><h2>Recent payment records</h2><p class="muted">Gateway status is recorded separately from order fulfillment.</p></div></div><div class="table-wrap"><table><thead><tr><th>Transaction</th><th>Order</th><th>Method</th><th>Gateway</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead><tbody><tr th:each="payment:${payments}"><td><code th:text="${payment.transactionId}"></code></td><td><a class="text-link" th:href="@{/admin/orders/{n}(n=${payment.order.orderNumber})}" th:text="${payment.order.orderNumber}"></a></td><td th:text="${#strings.replace(payment.method.name(),'_',' ')}"></td><td th:text="${payment.gateway}"></td><td>৳<span th:text="${#numbers.formatDecimal(payment.amount,1,0)}"></span></td><td><span class="badge" th:classappend="${payment.status.name()=='PAID'?'success':(payment.status.name()=='FAILED'?'danger':'warn')}" th:text="${#strings.replace(payment.status.name(),'_',' ')}"></span></td><td th:text="${#temporals.format(payment.createdAt,'dd MMM, hh:mm a')}"></td></tr><tr th:if="${payments.isEmpty()}"><td colspan="7">No payment records yet.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
