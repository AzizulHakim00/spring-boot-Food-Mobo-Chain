<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Menu item')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: sellerSidebar('menu')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Menu item','Menu management')}"></div><section class="dashboard-grid-2"><form class="panel" th:action="${editing ? '/seller/menu/' + foodId + '/edit' : '/seller/menu/new'}" th:object="${foodForm}" method="post"><div class="form-grid"><div class="field full"><label>Name</label><input th:field="*{name}"/><small class="field-error" th:errors="*{name}"></small></div><div class="field"><label>Category</label><select th:field="*{categoryId}"><option value="">Choose category</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><small class="field-error" th:errors="*{categoryId}"></small></div><div class="field"><label>Price (৳)</label><input type="number" step="0.01" min="1" th:field="*{price}"/><small class="field-error" th:errors="*{price}"></small></div><div class="field full"><label>Description</label><textarea th:field="*{description}" maxlength="1200"></textarea><small class="field-error" th:errors="*{description}"></small></div><div class="field full"><label>Food image</label><input type="file" accept="image/jpeg,image/png,image/webp" data-cloudinary-upload data-cloudinary-kind="foods" data-cloudinary-target="image" data-cloudinary-preview="foodPreview"/><small class="hint">Upload a JPG, PNG or WebP (max 2 MB). Save the form after uploading.</small><small class="field-error" role="status" data-upload-status></small><input th:field="*{image}" data-image-preview="foodPreview" readonly placeholder="Upload an image or use a bundled sample path"/><small class="field-error" th:errors="*{image}"></small></div><label class="cluster"><input type="checkbox" th:field="*{available}"/> Available</label><label class="cluster"><input type="checkbox" th:field="*{featured}"/> Featured</label><label class="cluster"><input type="checkbox" th:field="*{spicySupported}"/> Spice-level choice</label></div><div class="cluster" style="margin-top:22px"><button class="button" th:text="${editing ? 'Save changes' : 'Add food'}"></button><a class="button secondary" th:href="@{/seller/menu}">Cancel</a></div></form><aside class="panel"><span class="eyebrow">Image preview</span><img id="foodPreview" class="preview-img" th:src="${foodForm.image != null and !foodForm.image.isBlank() ? foodForm.image : '/images/ui/category-default.svg'}" alt="Food preview"/><p class="muted" style="margin-top:14px">Bundled WebP demo images stay available. New uploads are stored on Cloudinary, not on Render.</p></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script><script th:src="@{/js/cloudinary-upload.js}"></script></body></html>
