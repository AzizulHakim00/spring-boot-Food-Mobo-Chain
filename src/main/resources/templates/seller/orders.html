<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Seller orders')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: sellerSidebar('orders')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Orders','Operations')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="panel"><div class="panel-head"><div><h2>Customer orders</h2><p class="muted">Open an order to move it through the allowed status workflow.</p></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Placed</th><th></th></tr></thead><tbody><tr th:each="order:${orders}"><td><b th:text="${order.orderNumber}"></b></td><td th:text="${order.buyer.fullName}"></td><td th:text="${order.phone}"></td><td>৳<span th:text="${#numbers.formatDecimal(order.total,1,0)}"></span></td><td><span class="badge" th:classappend="${order.status.name()=='DELIVERED'?'success':(order.status.name()=='CANCELLED'?'danger':'info')}" th:text="${#strings.replace(order.status.name(),'_',' ')}"></span></td><td th:text="${#temporals.format(order.createdAt,'dd MMM, hh:mm a')}"></td><td><a class="button small secondary" th:href="@{/seller/orders/{number}(number=${order.orderNumber})}">Open</a></td></tr><tr th:if="${orders.isEmpty()}"><td colspan="7">No customer orders yet.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
