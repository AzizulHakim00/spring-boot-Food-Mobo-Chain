<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Food cart settings')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: sellerSidebar('cart')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Food cart settings','Storefront')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="dashboard-grid-2"><form class="panel" th:action="@{/seller/food-cart}" th:object="${foodCartForm}" method="post" enctype="multipart/form-data"><div class="panel-head"><div><h2>Public cart details</h2><p class="muted">Keep the customer-facing information accurate.</p></div></div><div class="form-grid"><div class="field full"><label>Cart name</label><input th:field="*{name}"/><small class="field-error" th:errors="*{name}"></small></div><div class="field"><label>Cuisine</label><input th:field="*{cuisine}"/><small class="field-error" th:errors="*{cuisine}"></small></div><div class="field"><label>Location</label><input th:field="*{location}"/><small class="field-error" th:errors="*{location}"></small></div><div class="field full"><label>Description</label><textarea th:field="*{description}"></textarea><small class="field-error" th:errors="*{description}"></small></div><div class="field full"><label>Cover image</label><input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" data-local-image-preview="cartPreview"/><small class="hint">Choose a JPG, PNG or WebP under 2 MB, then click Save changes to upload and update the cover together.</small><small class="hint" role="status" data-upload-status>Leave empty to keep the current cover image.</small><input th:field="*{coverImage}" readonly/><small class="field-error" th:errors="*{coverImage}"></small></div><div class="field"><label>Delivery fee</label><input type="number" step="0.01" min="0" th:field="*{deliveryFee}"/><small class="field-error" th:errors="*{deliveryFee}"></small></div><div class="field"><label>Delivery estimate (minutes)</label><input type="number" min="10" max="180" th:field="*{estimatedDeliveryMinutes}"/><small class="field-error" th:errors="*{estimatedDeliveryMinutes}"></small></div></div><small class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></small><button class="button" style="margin-top:20px" type="submit">Save changes</button></form><aside class="panel"><span class="eyebrow">Preview</span><h2 th:text="${foodCart.name}"></h2><img id="cartPreview" class="preview-img" th:src="${foodCart.coverImage}" th:alt="${foodCart.name}"/><div class="stat-list" style="margin-top:14px"><div class="stat-row"><span>Approval</span><span class="badge" th:classappend="${foodCart.approved ? 'success' : 'warn'}" th:text="${foodCart.approved ? 'Approved' : 'Pending'}"></span></div><div class="stat-row"><span>Open status</span><span class="badge" th:classappend="${foodCart.open ? 'success' : 'danger'}" th:text="${foodCart.open ? 'Open' : 'Closed'}"></span></div></div></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
