<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Seller order')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: sellerSidebar('orders')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Order details','Order processing')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="dashboard-grid-2"><div class="stack"><div class="panel"><div class="panel-head"><div><h2>Order status</h2><p class="muted">Only valid next steps are offered.</p></div><span class="badge" th:text="${#strings.replace(order.status.name(),'_',' ')}"></span></div><div class="cluster" th:if="${!allowedNext.isEmpty()}"><form th:each="next:${allowedNext}" th:action="@{/seller/orders/{n}/status(n=${order.orderNumber})}" method="post" th:attr="data-confirm=${next.name() == 'CANCELLED' ? 'This customer order will be cancelled and cannot continue through delivery.' : null},data-confirm-title=${next.name() == 'CANCELLED' ? 'Cancel order?' : null},data-confirm-action=${next.name() == 'CANCELLED' ? 'Cancel order' : null},data-confirm-cancel=${next.name() == 'CANCELLED' ? 'Keep order' : null},data-confirm-variant=${next.name() == 'CANCELLED' ? 'danger' : null}"><input type="hidden" name="status" th:value="${next}"/><button class="button" th:classappend="${next.name()=='CANCELLED'} ? 'danger'" th:text="${#strings.replace(next.name(),'_',' ')}"></button></form></div><p class="muted" th:if="${allowedNext.isEmpty()}">This order has reached a final state.</p></div><div class="panel"><h2>Order items</h2><div class="cart-line" th:each="item:${order.items}"><img th:src="${item.foodImage}" th:alt="${item.foodName}"/><div><b th:text="${item.foodName}"></b><small class="muted" style="display:block"><span th:text="${item.quantity}"></span> × ৳<span th:text="${#numbers.formatDecimal(item.unitPrice,1,0)}"></span> • <span th:text="${#strings.replace(item.spiceLevel.name(),'_',' ')}"></span></small></div><span></span><strong>৳<span th:text="${#numbers.formatDecimal(item.subtotal,1,0)}"></span></strong><span></span></div></div></div><aside class="stack"><div class="panel"><span class="eyebrow">Customer</span><h2 th:text="${order.buyer.fullName}"></h2><p><b th:text="${order.phone}"></b><br/><span th:text="${order.deliveryAddress}"></span></p><p class="muted" th:if="${order.note != null and !order.note.isBlank()}" th:text="${order.note}"></p></div><div class="summary-card"><span class="eyebrow light">Payment</span><h2 th:text="${payment.status}"></h2><div class="summary-row"><span>Method</span><b th:text="${#strings.replace(payment.method.name(),'_',' ')}"></b></div><div class="summary-row"><span>Delivery state</span><b th:text="${#strings.replace(delivery.status.name(),'_',' ')}"></b></div><div class="summary-row total"><span>Total</span><b>৳<span th:text="${#numbers.formatDecimal(order.total,1,0)}"></span></b></div></div></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
