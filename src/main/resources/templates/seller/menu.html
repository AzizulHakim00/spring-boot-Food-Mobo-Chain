<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Seller menu')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: sellerSidebar('menu')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Menu management','Food catalog')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="panel"><div class="panel-head"><div><h2>Your menu</h2><p class="muted">Edit pricing, category, images and availability.</p></div><a class="button small" th:href="@{/seller/menu/new}">+ Add food</a></div><div class="table-wrap"><table><thead><tr><th>Food</th><th>Category</th><th>Price</th><th>Available</th><th>Featured</th><th>Actions</th></tr></thead><tbody><tr th:each="food:${menu}"><td><div class="table-food"><img th:src="${food.image}" th:alt="${food.name}"/><div><b th:text="${food.name}"></b><small class="muted" style="display:block" th:text="${#strings.abbreviate(food.description,70)}"></small></div></div></td><td th:text="${food.category.name}"></td><td>৳<span th:text="${#numbers.formatDecimal(food.price,1,0)}"></span></td><td><span class="badge" th:classappend="${food.available ? 'success' : 'danger'}" th:text="${food.available ? 'Available' : 'Hidden'}"></span></td><td th:text="${food.featured ? 'Yes' : 'No'}"></td><td><div class="table-actions"><a th:href="@{/seller/menu/{id}/edit(id=${food.id})}">Edit</a><form th:action="@{/seller/menu/{id}/toggle(id=${food.id})}" method="post"><button th:text="${food.available ? 'Hide' : 'Show'}"></button></form><form th:action="@{/seller/menu/{id}/archive(id=${food.id})}" method="post" data-confirm="Archive this food item? It will disappear from the seller and customer menu while historical orders remain safe."><button class="danger">Archive</button></form></div></td></tr><tr th:if="${menu.isEmpty()}"><td colspan="6">No food items yet. Add your first menu item.</td></tr></tbody></table></div></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
